<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A1A7AE"/>
    </marker>
    <marker id="arr-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F7675E"/>
    </marker>
    <style>
      .panel-gray { fill: rgba(255,255,255,0.03); stroke: #A1A7AE; stroke-width: 1.5; }
      .panel-red { fill: rgba(247,103,94,0.05); stroke: #F7675E; stroke-width: 1.5; }
      .heading { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
      .h-gray { fill: #FFFFFF; }
      .h-red { fill: #F7675E; }
      .sub { fill: #A1A7AE; font-size: 13px; font-style: italic; }
      .pill-gray { fill: rgba(255,255,255,0.05); stroke: #A1A7AE; stroke-width: 1.5; }
      .pill-dead { fill: none; stroke: #A1A7AE; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .pill-red { fill: rgba(247,103,94,0.18); stroke: #F7675E; stroke-width: 1.5; }
      .pill-text { fill: #FFFFFF; font-size: 14px; font-weight: 600; }
      .pill-text-dead { fill: #A1A7AE; font-size: 13px; font-style: italic; }
      .flow-gray { stroke: #A1A7AE; stroke-width: 2; }
      .flow-red { stroke: #F7675E; stroke-width: 2; fill: none; }
      .tag-gray { fill: #A1A7AE; font-size: 14px; font-weight: 700; }
      .tag-red { fill: #F7675E; font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <!-- SOM PROSJEKT -->
  <g transform="translate(20, 6)">
    <rect class="panel-gray" width="1060" height="172" rx="8"/>
    <text class="heading h-gray" x="24" y="36">SOM PROSJEKT</text>
    <text class="sub" x="220" y="36">Bygges, leveres, ferdig — adopsjon = pålagt</text>

    <rect class="pill-gray" x="70" y="84" width="120" height="32" rx="16"/>
    <text class="pill-text" x="130" y="105" text-anchor="middle">Plan</text>
    <line class="flow-gray" x1="190" y1="100" x2="245" y2="100" marker-end="url(#arr-gray)"/>
    <rect class="pill-gray" x="255" y="84" width="120" height="32" rx="16"/>
    <text class="pill-text" x="315" y="105" text-anchor="middle">Build</text>
    <line class="flow-gray" x1="375" y1="100" x2="430" y2="100" marker-end="url(#arr-gray)"/>
    <rect class="pill-gray" x="440" y="84" width="120" height="32" rx="16"/>
    <text class="pill-text" x="500" y="105" text-anchor="middle">Ship</text>
    <line class="flow-gray" x1="560" y1="100" x2="615" y2="100" marker-end="url(#arr-gray)"/>
    <rect class="pill-gray" x="625" y="84" width="120" height="32" rx="16"/>
    <text class="pill-text" x="685" y="105" text-anchor="middle">"Ferdig"</text>
    <line class="flow-gray" x1="745" y1="100" x2="800" y2="100" stroke-dasharray="5 5"/>
    <rect class="pill-dead" x="810" y="84" width="190" height="32" rx="16"/>
    <text class="pill-text-dead" x="905" y="105" text-anchor="middle">Ingen eier utfallet</text>

    <text class="tag-gray" x="530" y="152" text-anchor="middle">→ Hyllevare med gode intensjoner</text>
  </g>

  <!-- SOM PRODUKT -->
  <g transform="translate(20, 196)">
    <rect class="panel-red" width="1060" height="178" rx="8"/>
    <text class="heading h-red" x="24" y="36">SOM PRODUKT</text>
    <text class="sub" x="220" y="36">Utvikles kontinuerlig — utviklere er kunder, adopsjon er metrikken</text>

    <!-- loop: Discover → Build → Ship → Mål adopsjon → Iterér → Discover -->
    <rect class="pill-red" x="265" y="55" width="130" height="30" rx="15"/>
    <text class="pill-text" x="330" y="75" text-anchor="middle">Discover</text>
    <rect class="pill-red" x="465" y="45" width="130" height="30" rx="15"/>
    <text class="pill-text" x="530" y="65" text-anchor="middle">Build</text>
    <rect class="pill-red" x="665" y="55" width="130" height="30" rx="15"/>
    <text class="pill-text" x="730" y="75" text-anchor="middle">Ship</text>
    <rect class="pill-red" x="575" y="120" width="150" height="30" rx="15"/>
    <text class="pill-text" x="650" y="140" text-anchor="middle">Mål adopsjon</text>
    <rect class="pill-red" x="350" y="120" width="120" height="30" rx="15"/>
    <text class="pill-text" x="410" y="140" text-anchor="middle">Iterér</text>

    <path class="flow-red" d="M 398 64 C 420 59, 440 57, 462 58" marker-end="url(#arr-red2)"/>
    <path class="flow-red" d="M 598 58 C 620 57, 640 59, 662 64" marker-end="url(#arr-red2)"/>
    <path class="flow-red" d="M 798 72 C 835 90, 795 122, 730 132" marker-end="url(#arr-red2)"/>
    <path class="flow-red" d="M 572 135 L 476 135" marker-end="url(#arr-red2)"/>
    <path class="flow-red" d="M 345 135 C 290 128, 283 105, 300 92" marker-end="url(#arr-red2)"/>

    <text class="tag-red" x="530" y="170" text-anchor="middle">→ Et produkt utviklerne velger frivillig</text>
  </g>
</svg>
