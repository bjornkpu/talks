      <rect class="adapter" x="45" y="36" width="110" height="20" rx="10"/>
      <text class="adapter-text" x="100" y="50" text-anchor="middle">Azure Blob</text>
      <rect class="adapter" x="45" y="60" width="110" height="20" rx="10"/>
      <text class="adapter-text" x="100" y="74" text-anchor="middle">S3</text>
