      <text class="port-text" x="100" y="17" text-anchor="middle">Orchestrator</text>
      <line class="connector" x1="100" y1="26" x2="100" y2="36"/>
      <rect class="adapter" x="45" y="36" width="110" height="20" rx="10"/>
      <text class="adapter-text" x="100" y="50" text-anchor="middle">Crossplane</text>
      <rect class="adapter" x="45" y="60" width="110" height="20" rx="10"/>
      <text class="adapter-text" x="100" y="74" text-anchor="middle">Kratix</text>
