<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .team-card { stroke-width: 1.5; }
      .legacy { fill: rgba(161,167,174,0.08); stroke: #A1A7AE; }
      .hybrid { fill: rgba(176,167,255,0.08); stroke: #B0A7FF; }
      .modern { fill: rgba(73,215,255,0.08); stroke: #49D7FF; }
      .team-name { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; fill: #FFFFFF; }
      .team-sub { fill: #A1A7AE; font-size: 12px; font-style: italic; }
      .stack-pill { stroke-width: 1; }
      .pill-text { fill: #FFFFFF; font-size: 11px; font-weight: 600; }
      .axis-line { stroke: rgba(255,255,255,0.25); stroke-width: 1; }
      .axis-label { fill: #A1A7AE; font-size: 11px; font-style: italic; letter-spacing: 0.04em; }
      .platform-band { fill: rgba(247,103,94,0.1); stroke: #F7675E; stroke-width: 1.5; }
      .platform-text { fill: #F7675E; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; }
      .arrow-down { stroke: #F7675E; stroke-width: 1.5; fill: none; opacity: 0.6; }
      .step-text { fill: #FFFFFF; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Maturity axis -->
  <g transform="translate(60, 30)">
    <line class="axis-line" x1="0" y1="0" x2="980" y2="0"/>
    <text class="axis-label" x="0" y="-10">←  HVOR DE ER I DAG</text>
    <text class="axis-label" x="980" y="-10" text-anchor="end">DIN IDEAL-TILSTAND  →</text>
  </g>

  <!-- Three teams at different maturity levels -->

  <!-- TEAM A — Legacy stack -->
  <g transform="translate(60, 60)">
    <rect class="team-card legacy" width="280" height="150" rx="6"/>
    <text class="team-name" x="20" y="30">TEAM A</text>
    <text class="team-sub" x="20" y="48">Eldre stack — fungerer i dag</text>

    <rect class="stack-pill" x="20" y="62" width="80" height="20" rx="3" fill="rgba(161,167,174,0.4)" stroke="#A1A7AE"/>
    <text class="pill-text" x="60" y="76" text-anchor="middle">VMs</text>

    <rect class="stack-pill" x="110" y="62" width="80" height="20" rx="3" fill="rgba(161,167,174,0.4)" stroke="#A1A7AE"/>
    <text class="pill-text" x="150" y="76" text-anchor="middle">Jenkins</text>

    <rect class="stack-pill" x="200" y="62" width="60" height="20" rx="3" fill="rgba(161,167,174,0.4)" stroke="#A1A7AE"/>
    <text class="pill-text" x="230" y="76" text-anchor="middle">Bash</text>

    <rect class="stack-pill" x="20" y="88" width="100" height="20" rx="3" fill="rgba(161,167,174,0.4)" stroke="#A1A7AE"/>
    <text class="pill-text" x="70" y="102" text-anchor="middle">.env-filer</text>

    <rect class="stack-pill" x="130" y="88" width="130" height="20" rx="3" fill="rgba(161,167,174,0.4)" stroke="#A1A7AE"/>
    <text class="pill-text" x="195" y="102" text-anchor="middle">Manuell deploy</text>

    <text class="team-sub" x="20" y="135" fill="#FFFFFF" font-style="normal" font-size="11">10+ år teknisk gjeld</text>
  </g>

  <!-- TEAM B — Hybrid -->
  <g transform="translate(410, 60)">
    <rect class="team-card hybrid" width="280" height="150" rx="6"/>
    <text class="team-name" x="20" y="30">TEAM B</text>
    <text class="team-sub" x="20" y="48">Halvveis modernisert</text>

    <rect class="stack-pill" x="20" y="62" width="80" height="20" rx="3" fill="rgba(176,167,255,0.4)" stroke="#B0A7FF"/>
    <text class="pill-text" x="60" y="76" text-anchor="middle">K8s (basic)</text>

    <rect class="stack-pill" x="110" y="62" width="80" height="20" rx="3" fill="rgba(176,167,255,0.4)" stroke="#B0A7FF"/>
    <text class="pill-text" x="150" y="76" text-anchor="middle">GH Actions</text>

    <rect class="stack-pill" x="200" y="62" width="60" height="20" rx="3" fill="rgba(176,167,255,0.4)" stroke="#B0A7FF"/>
    <text class="pill-text" x="230" y="76" text-anchor="middle">Helm</text>

    <rect class="stack-pill" x="20" y="88" width="100" height="20" rx="3" fill="rgba(176,167,255,0.4)" stroke="#B0A7FF"/>
    <text class="pill-text" x="70" y="102" text-anchor="middle">Vault (delvis)</text>

    <rect class="stack-pill" x="130" y="88" width="130" height="20" rx="3" fill="rgba(176,167,255,0.4)" stroke="#B0A7FF"/>
    <text class="pill-text" x="195" y="102" text-anchor="middle">Egne scripts</text>

    <text class="team-sub" x="20" y="135" fill="#FFFFFF" font-style="normal" font-size="11">Vil flytte seg, mangler tid</text>
  </g>

  <!-- TEAM C — Modern -->
  <g transform="translate(760, 60)">
    <rect class="team-card modern" width="280" height="150" rx="6"/>
    <text class="team-name" x="20" y="30">TEAM C</text>
    <text class="team-sub" x="20" y="48">Cloud-native fra dag én</text>

    <rect class="stack-pill" x="20" y="62" width="80" height="20" rx="3" fill="rgba(73,215,255,0.4)" stroke="#49D7FF"/>
    <text class="pill-text" x="60" y="76" text-anchor="middle">K8s + Argo</text>

    <rect class="stack-pill" x="110" y="62" width="80" height="20" rx="3" fill="rgba(73,215,255,0.4)" stroke="#49D7FF"/>
    <text class="pill-text" x="150" y="76" text-anchor="middle">GitOps</text>

    <rect class="stack-pill" x="200" y="62" width="60" height="20" rx="3" fill="rgba(73,215,255,0.4)" stroke="#49D7FF"/>
    <text class="pill-text" x="230" y="76" text-anchor="middle">OPA</text>

    <rect class="stack-pill" x="20" y="88" width="100" height="20" rx="3" fill="rgba(73,215,255,0.4)" stroke="#49D7FF"/>
    <text class="pill-text" x="70" y="102" text-anchor="middle">SealedSecrets</text>

    <rect class="stack-pill" x="130" y="88" width="130" height="20" rx="3" fill="rgba(73,215,255,0.4)" stroke="#49D7FF"/>
    <text class="pill-text" x="195" y="102" text-anchor="middle">OTel + Prometheus</text>

    <text class="team-sub" x="20" y="135" fill="#FFFFFF" font-style="normal" font-size="11">Vil lengst fremover</text>
  </g>

  <!-- Arrows showing teams moving forward -->
  <path class="arrow-down" d="M 200 215 L 200 240"/>
  <text class="step-text" x="200" y="258" text-anchor="middle" font-size="10">+1 steg</text>

  <path class="arrow-down" d="M 550 215 L 550 240"/>
  <text class="step-text" x="550" y="258" text-anchor="middle" font-size="10">+1 steg</text>

  <path class="arrow-down" d="M 900 215 L 900 240"/>
  <text class="step-text" x="900" y="258" text-anchor="middle" font-size="10">+1 steg</text>

  <!-- Platform band that meets all three -->
  <g transform="translate(60, 270)">
    <rect class="platform-band" width="980" height="80" rx="6"/>
    <text class="platform-text" x="490" y="35" text-anchor="middle">PLATTFORMEN MØTER ALLE TRE — DER DE ER</text>
    <text x="490" y="60" text-anchor="middle" fill="#A1A7AE" font-size="13" font-style="italic">
      Fjerner friksjon. Pålegger ikke migrering. Hjelper hvert team flytte seg ett steg.
    </text>
  </g>
</svg>
